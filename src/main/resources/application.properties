spring.application.name=mobile
server.port=${PORT:9654}

spring.config.import=optional:file:.env[.properties]

# Banco
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Segurança
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:300000}
app.cors.origens=${CORS_ORIGINS:http://localhost:5173}

# Firebase
app.firebase.credenciais=${FIREBASE_CREDENCIAIS}

# Recuperação de senha
app.senha.url-redefinicao=${URL_REDEFINICAO_SENHA}
app.mail.remetente=${MAIL_FROM}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

server.port=9654

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

spring.config.import=optional:file:.env[.properties]

# Datas
app.timezone=America/Sao_Paulo

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s
spring.data.redis.repositories.enabled=false

# Ranking
app.ranking.cycle-epoch=${RANKING_CYCLE_EPOCH}
app.ranking.retention-days=90
app.ranking.sync-delay-ms=5000
app.ranking.sync-batch-size=100

# Fechamento das janelas comunitárias
app.validation.batch-size=100
app.validation.delay-ms=60000

# Validador de imagens
app.validador.hosts-permitidos=${HOSTS_PERMITIDOS}
app.validador.limiar-confianca=${LIMIAR_CONFIANCA:0.5}
app.validador.limiar-revisao=${LIMIAR_REVISAO:}
app.validador.limiares-por-categoria=${LIMIARES_POR_CATEGORIA:}

app.validador.max-pedidos-simultaneos=${MAX_PEDIDOS_SIMULTANEOS:8}
app.validador.tamanho-maximo-bytes=${TAMANHO_MAXIMO_BYTES:10000000}
app.validador.timeout-download-segundos=${TIMEOUT_DOWNLOAD_SEGUNDOS:10}

app.validador.clip-dir=${CLIP_DIR}
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.display-request-duration=true
